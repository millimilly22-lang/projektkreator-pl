<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FactSphere</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#07111f;color:#e5eef8}.hero{padding:60px clamp(16px,6vw,80px) 34px;background:radial-gradient(circle at 80% 10%,#173f69,transparent 35%),linear-gradient(180deg,#091728,#07111f)}.brand{font-weight:900;font-size:22px;color:#7dd3fc}.hero h1{font-size:clamp(42px,7vw,78px);margin:18px 0 10px;letter-spacing:-.05em}.hero h1 span{color:#38bdf8}.hero p{color:#a8bbcf;max-width:760px;line-height:1.7}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.tools input{flex:1;min-width:240px;border:1px solid #28435e;background:#0c1d30;color:#fff;border-radius:12px;padding:12px 14px}.tools button{border:1px solid #28435e;background:#0d2339;color:#c7d9ec;border-radius:999px;padding:10px 13px;font-weight:800}.tools button.active{background:#38bdf8;color:#052033;border-color:#38bdf8}.main{padding:24px clamp(16px,6vw,80px) 70px}.count{color:#7dd3fc;font-size:12px;font-weight:800;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.fact{background:#0d1d2e;border:1px solid #213950;border-radius:18px;padding:20px;min-height:210px;display:flex;flex-direction:column}.fact .cat{font-size:10px;letter-spacing:.12em;color:#7dd3fc;font-weight:900;text-transform:uppercase}.fact h2{font-size:20px;line-height:1.35;margin:10px 0}.fact p{color:#a9bbcd;line-height:1.6;font-size:14px}.fact footer{margin-top:auto;display:flex;justify-content:space-between;align-items:center}.fact footer button{border:0;background:#112a42;color:#7dd3fc;border-radius:9px;padding:8px;font-weight:900}.fact footer button.saved{background:#7dd3fc;color:#052033}.empty{grid-column:1/-1;text-align:center;color:#8da4ba;padding:50px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero{padding-top:40px}}</style></head><body><section class="hero"><div class="brand">FactSphere</div><h1>Ciekawostki, które <span>zostają w głowie.</span></h1><p>Nauka, psychologia, biologia, relacje i codzienne zjawiska — przeglądaj, wyszukuj i zapisuj interesujące fakty.</p><div class="tools"><input id="q" placeholder="Szukaj faktu..." oninput="render()"><button class="active" onclick="setCat('Wszystkie',this)">Wszystkie</button><button onclick="setCat('Nauka',this)">Nauka</button><button onclick="setCat('Psychologia',this)">Psychologia</button><button onclick="setCat('Biologia',this)">Biologia</button><button onclick="setCat('Relacje',this)">Relacje</button><button onclick="setCat('Introwertycy',this)">Introwertycy</button></div></section><main class="main"><div class="count" id="count"></div><div class="grid" id="grid"></div></main><script>const facts=[['Nauka','Światło ze Słońca potrzebuje około 8 minut, aby dotrzeć do Ziemi.','To dlatego patrząc na Słońce widzimy je takim, jakie było kilka minut wcześniej.'],['Nauka','Woda może jednocześnie wrzeć i zamarzać w szczególnych warunkach ciśnienia.','Zjawisko wiąże się z punktem potrójnym substancji.'],['Biologia','Ludzkie ciało nieustannie wymienia komórki, ale tempo różni się między tkankami.','Nie wszystkie komórki odnawiają się równie szybko.'],['Biologia','Skóra jest największym narządem ludzkiego ciała.','Pełni funkcję ochronną, termoregulacyjną i sensoryczną.'],['Psychologia','Łatwiej zapamiętujemy informacje, które łączymy z istniejącą wiedzą.','Skojarzenia pomagają mózgowi tworzyć bardziej dostępne ścieżki pamięci.'],['Psychologia','Niedokończone zadania mogą częściej wracać do świadomości.','To jeden z powodów, dla których lista zadań bywa pomocna przed odpoczynkiem.'],['Relacje','Aktywne słuchanie to coś więcej niż czekanie na swoją kolej, by odpowiedzieć.','Pomaga sprawdzić, czy naprawdę rozumiemy drugą osobę.'],['Relacje','Sposób rozpoczęcia trudnej rozmowy często wpływa na jej dalszy przebieg.','Spokojny początek zwykle ułatwia skupienie się na problemie zamiast na obronie.'],['Introwertycy','Introwersja nie oznacza nieśmiałości.','Opisuje raczej sposób reagowania na stymulację i preferencje dotyczące kontaktów społecznych.'],['Introwertycy','Osoba introwertyczna może być bardzo towarzyska.','Po intensywnym kontakcie społecznym może jednak potrzebować więcej czasu na regenerację.'],['Nauka','Dźwięk porusza się szybciej w wodzie niż w powietrzu.','Prędkość fali zależy od właściwości ośrodka.'],['Biologia','Serce człowieka bije około 100 tysięcy razy na dobę.','Dokładna liczba zależy m.in. od tętna i aktywności.']].map((x,i)=>({id:i,c:x[0],t:x[1],d:x[2]}));let cat='Wszystkie';const saved=new Set(JSON.parse(localStorage.getItem('fs_saved')||'[]'));function setCat(c,b){cat=c;document.querySelectorAll('.tools button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function save(id){saved.has(id)?saved.delete(id):saved.add(id);localStorage.setItem('fs_saved',JSON.stringify([...saved]));render()}function render(){const q=document.getElementById('q').value.toLowerCase();const rows=facts.filter(x=>(cat==='Wszystkie'||x.c===cat)&&(`${x.t} ${x.d}`.toLowerCase().includes(q)));count.textContent=`${rows.length} faktów • ${saved.size} zapisanych`;grid.innerHTML=rows.length?rows.map(x=>`<article class="fact"><span class="cat">${x.c}</span><h2>${x.t}</h2><p>${x.d}</p><footer><span>#${String(x.id+1).padStart(2,'0')}</span><button class="${saved.has(x.id)?'saved':''}" onclick="save(${x.id})">${saved.has(x.id)?'★ Zapisano':'☆ Zapisz'}</button></footer></article>`).join(''):'<div class="empty">Brak wyników dla tego wyszukiwania.</div>'}render()</script></body></html>
