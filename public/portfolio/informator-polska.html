<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Informator Polska</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f7f8fb;color:#172033}.top{background:#b91c1c;color:#fff;padding:10px 20px;text-align:center;font-size:12px}.header{background:#fff;border-bottom:1px solid #e5e7eb;padding:18px clamp(16px,6vw,80px);display:flex;align-items:center;gap:24px;position:sticky;top:0}.logo{font-weight:900;font-size:23px}.logo span{color:#dc2626}.header nav{display:flex;gap:18px}.header nav button{border:0;background:none;font-weight:700;color:#475569}.search{margin-left:auto;display:flex;gap:8px}.search input{border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;min-width:240px}.hero{padding:60px clamp(16px,6vw,80px);background:linear-gradient(135deg,#fff,#fff7ed)}.hero h1{font-size:clamp(38px,6vw,66px);max-width:900px;margin:0 0 16px;letter-spacing:-.04em}.hero p{max-width:720px;color:#64748b;line-height:1.7}.cats{padding:24px clamp(16px,6vw,80px);display:flex;gap:9px;overflow:auto}.cats button{white-space:nowrap;border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:9px 13px;font-weight:700}.cats button.active{background:#b91c1c;color:#fff;border-color:#b91c1c}.grid{padding:0 clamp(16px,6vw,80px) 70px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:17px;padding:20px;min-height:220px;display:flex;flex-direction:column}.card span{font-size:11px;color:#dc2626;font-weight:900}.card h2{font-size:21px;margin:10px 0}.card p{color:#64748b;line-height:1.55}.card button{margin-top:auto;border:0;background:#fff1f2;color:#b91c1c;border-radius:10px;padding:10px;font-weight:800;text-align:left}.reader{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;z-index:20;padding:30px;overflow:auto}.reader.open{display:block}.reader article{max-width:800px;margin:auto;background:#fff;border-radius:20px;padding:32px;min-height:80vh}.reader .close{float:right;border:0;background:#f1f5f9;border-radius:10px;padding:10px}.reader h1{font-size:38px;letter-spacing:-.03em}.reader h2{margin-top:28px}.reader p,.reader li{color:#475569;line-height:1.75}.empty{grid-column:1/-1;text-align:center;padding:50px;color:#64748b}@media(max-width:850px){.header nav{display:none}.search{margin-left:auto}.search input{min-width:0;width:180px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:580px){.header{padding:12px}.logo{font-size:18px}.search input{width:130px}.grid{grid-template-columns:1fr}.reader{padding:8px}.reader article{padding:22px}.hero{padding-top:40px}}</style></head><body><div class="top">Informator Polska — praktyczne informacje i przewodniki w jednym miejscu</div><header class="header"><div class="logo">Informator <span>Polska</span></div><nav><button onclick="filter('Świadczenia')">Świadczenia</button><button onclick="filter('Firma')">Firma</button><button onclick="filter('Dokumenty')">Dokumenty</button><button onclick="filter('Podatki')">Podatki</button></nav><div class="search"><input id="q" placeholder="Szukaj poradnika..." oninput="render()"></div></header><section class="hero"><h1>Najważniejsze sprawy w Polsce wyjaśnione prosto.</h1><p>Świadczenia, działalność gospodarcza, podatki, dokumenty, urząd, ZUS i codzienne formalności — uporządkowane w krótkie poradniki.</p></section><div class="cats"><button class="active" onclick="filter('Wszystkie',this)">Wszystkie</button><button onclick="filter('Świadczenia',this)">Świadczenia</button><button onclick="filter('Firma',this)">Firma</button><button onclick="filter('Dokumenty',this)">Dokumenty</button><button onclick="filter('Podatki',this)">Podatki</button><button onclick="filter('ZUS',this)">ZUS</button></div><main class="grid" id="grid"></main><div class="reader" id="reader"><article><button class="close" onclick="closeReader()">✕ Zamknij</button><div id="article"></div></article></div><script>const data=[{c:'Świadczenia',t:'800+ — podstawowe informacje',s:'Kto może otrzymać świadczenie, gdzie złożyć wniosek i jakie dane przygotować.',body:'Świadczenie wychowawcze jest obsługiwane elektronicznie. Przed złożeniem wniosku przygotuj dane rodzica lub opiekuna oraz dziecka. Sprawdź aktualny okres świadczeniowy i terminy w oficjalnym serwisie ZUS. Po wysłaniu zachowaj potwierdzenie złożenia wniosku.'},{c:'Firma',t:'Jak przygotować się do założenia działalności',s:'Nazwa, PKD, forma opodatkowania, rachunek i podstawowe formalności.',body:'Przed rejestracją przygotuj nazwę działalności, adres, planowany zakres usług oraz kody PKD. Zastanów się nad formą opodatkowania i sposobem prowadzenia księgowości. Po rejestracji sprawdź obowiązki wobec ZUS, urzędu skarbowego oraz zasady dotyczące rachunku firmowego.'},{c:'Dokumenty',t:'Profil zaufany — do czego służy',s:'Jak podpisywać sprawy urzędowe online i logować się do usług publicznych.',body:'Profil zaufany umożliwia potwierdzanie tożsamości w wielu usługach publicznych online. Możesz używać go do wysyłania pism, podpisywania wniosków i logowania do wybranych systemów administracji. Sposób założenia i przedłużenia profilu warto zawsze sprawdzić w oficjalnym serwisie gov.pl.'},{c:'Podatki',t:'Faktura — co warto sprawdzić przed wysłaniem',s:'Lista danych, które warto zweryfikować na fakturze.',body:'Sprawdź dane sprzedawcy i nabywcy, NIP, datę wystawienia, numer dokumentu, nazwę usługi lub towaru, wartości netto/brutto oraz właściwe stawki podatku. Przed wysłaniem upewnij się też, że numer rachunku i termin płatności są poprawne.'},{c:'ZUS',t:'ZUS dla przedsiębiorcy — lista startowa',s:'Najważniejsze rzeczy do sprawdzenia po rozpoczęciu działalności.',body:'Po rozpoczęciu działalności sprawdź zgłoszenia do ubezpieczeń, terminy składek oraz to, czy przysługuje Ci ulga. Rodzaj składek zależy od sytuacji przedsiębiorcy. Aktualne zasady i kwoty należy potwierdzić bezpośrednio w ZUS.'},{c:'Dokumenty',t:'Dowód osobisty — kiedy wymienić dokument',s:'Przypadki, w których trzeba sprawdzić ważność lub złożyć wniosek o nowy dowód.',body:'Wniosek o nowy dowód może być potrzebny po upływie ważności, zmianie danych, utracie dokumentu albo jego uszkodzeniu. Przed wizytą lub złożeniem wniosku online sprawdź aktualne wymagania dotyczące zdjęcia i potwierdzenia tożsamości.'},{c:'Firma',t:'Pierwsza strona internetowa firmy',s:'Co przygotować przed zleceniem strony.',body:'Przygotuj nazwę firmy, opis usług, dane kontaktowe, logo lub preferowane kolory, zdjęcia oraz przykłady stron, które Ci się podobają. Zastanów się też, czy potrzebujesz formularza, mapy, rezerwacji, płatności lub dodatkowego języka.'},{c:'Podatki',t:'Dokumenty kosztowe — prosty porządek',s:'Jak organizować faktury i paragony, żeby łatwiej prowadzić firmę.',body:'Warto przechowywać dokumenty według miesięcy i kategorii, zapisywać potwierdzenia płatności oraz regularnie sprawdzać, czy do każdej transakcji jest odpowiedni dokument. Przy wątpliwościach podatkowych skonsultuj się z księgowością.'}];let cat='Wszystkie';function filter(c,b){cat=c;document.querySelectorAll('.cats button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}function render(){const q=document.getElementById('q').value.toLowerCase();const rows=data.filter(x=>(cat==='Wszystkie'||x.c===cat)&&(`${x.t} ${x.s} ${x.c}`.toLowerCase().includes(q)));grid.innerHTML=rows.length?rows.map((x,i)=>`<article class="card"><span>${x.c}</span><h2>${x.t}</h2><p>${x.s}</p><button onclick="openReader('${encodeURIComponent(x.t)}')">Czytaj poradnik →</button></article>`).join(''):'<div class="empty">Brak wyników. Zmień kategorię lub wyszukiwanie.</div>'}function openReader(t){const x=data.find(a=>a.t===decodeURIComponent(t));article.innerHTML=`<span style="color:#b91c1c;font-weight:900">${x.c}</span><h1>${x.t}</h1><p>${x.s}</p><h2>Najważniejsze informacje</h2><p>${x.body}</p><h2>Co zrobić dalej?</h2><ul><li>Sprawdź aktualne wymagania w oficjalnym źródle.</li><li>Przygotuj potrzebne dane i dokumenty.</li><li>Zachowaj potwierdzenia wysłania wniosków lub płatności.</li></ul><p><b>Uwaga:</b> poradnik ma charakter informacyjny i nie zastępuje indywidualnej porady prawnej, podatkowej lub urzędowej.</p>`;reader.classList.add('open')}function closeReader(){reader.classList.remove('open')}render()</script></body></html>
